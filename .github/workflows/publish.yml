name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version slug (e.g. patch, minor, major, or 1.2.3)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required to mint the OIDC token for npm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Bump version
        run: npm version "${{ github.event.inputs.version }}" --no-git-tag-version

      - name: Publish to npm
        run: npm publish --provenance --access public
